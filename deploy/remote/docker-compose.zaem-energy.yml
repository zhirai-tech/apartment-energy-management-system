services:
  zaem-energy-redis:
    image: redis:7-alpine
    container_name: zaem-energy-redis
    restart: always
    command: redis-server --appendonly yes
    networks:
      - zaem_energy_default

  zaem-energy-server:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    container_name: zaem-energy-server
    restart: always
    depends_on:
      - zaem-energy-redis
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://zaem-energy-redis:6379
      PORT: 3001
    ports:
      - "127.0.0.1:3011:3001"
    networks:
      - zaem_energy_default
      - deploy_default

  zaem-energy-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: zaem-energy-tunnel
    restart: always
    depends_on:
      - zaem-energy-server
    command: tunnel --no-autoupdate --url http://zaem-energy-server:3001
    networks:
      - zaem_energy_default

networks:
  zaem_energy_default:
    driver: bridge
  deploy_default:
    external: true
